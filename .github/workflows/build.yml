---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  codeception:
    uses: yii2-framework/actions/.github/workflows/codeception.yml@a28eb7d4ab03abd53ccd7c79014b3b27d09932ff # v2.0.1
    with:
      codeception-command: >-
        APP_ENV=test APP_DEBUG=false
        vendor/bin/codecept run Web --coverage-xml
      debug: true
      extensions: intl, sodium
      php-version: '["8.3","8.4","8.5"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
